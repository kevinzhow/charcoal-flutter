name: charcoal_ui
description: Charcoal V2 components for Flutter, built on Material with a generated theme contract.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  charcoal_icons:
    path: ../charcoal_icons
  charcoal_theme:
    path: ../charcoal_theme
  charcoal_tokens:
    path: ../charcoal_tokens
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_svg: ^2.3.0
  flutter_test:
    sdk: flutter
