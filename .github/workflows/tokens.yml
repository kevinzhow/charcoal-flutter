name: Generated source drift

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * 1-5"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          cache: true
      - run: flutter pub get
      - run: dart run tool/tokens.dart check
      - run: dart run tool/icons.dart check
      - run: dart run tool/agent_ready.dart check
      - run: dart analyze --fatal-infos
      - run: dart test
      - run: dart test packages/charcoal_catalog
      - run: dart test packages/charcoal_cli
      - run: dart test packages/charcoal_mcp
      - run: flutter test
        working-directory: packages/charcoal_icons
      - run: flutter test
        working-directory: packages/charcoal_ui
      - run: flutter test
        working-directory: example
