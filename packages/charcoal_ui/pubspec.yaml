name: charcoal_ui
description: A Charcoal V2 UI library built directly on Flutter Widgets.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  charcoal_icons:
    path: ../charcoal_icons
  charcoal_tokens:
    path: ../charcoal_tokens
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - assets/fonts/OFL.txt
  fonts:
    - family: CharcoalSans
      fonts:
        - asset: assets/fonts/CharcoalSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/CharcoalSans-Bold.ttf
          weight: 700
