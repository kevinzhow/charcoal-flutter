name: Update Charcoal V2 sources

on:
  schedule:
    - cron: "0 1 * * 1-5"
  workflow_dispatch:
    inputs:
      ref:
        description: Upstream pixiv/charcoal tag, branch, or commit
        default: main
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          cache: true
      - run: flutter pub get
      - name: Update and generate
        run: |
          dart run tool/tokens.dart update --ref "${{ inputs.ref || 'main' }}"
          dart run tool/icons.dart update --ref "${{ inputs.ref || 'main' }}"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test
      - run: flutter test
        working-directory: packages/charcoal_icons
      - run: flutter test
        working-directory: packages/charcoal_ui
      - run: flutter test
        working-directory: example
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/charcoal-v2-sources
          commit-message: "chore: update Charcoal V2 sources"
          title: "chore: update Charcoal V2 sources"
          body-path: tokens/diff.md
          delete-branch: true
