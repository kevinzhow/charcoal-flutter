name: charcoal_ui_showcase
description: Adaptive desktop, mobile, and web showcase for Charcoal UI V2.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  charcoal_icons:
    path: ../packages/charcoal_icons
  charcoal_ui:
    path: ../packages/charcoal_ui
  flutter:
    sdk: flutter
  flutter_skill: ^0.9.36

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: false
  assets:
    - assets/fonts/OFL.txt
    - assets/fonts/README.md
  fonts:
    - family: Noto Sans
      fonts:
        - asset: assets/fonts/NotoSans-Variable.woff2
          weight: 400
        - asset: assets/fonts/NotoSans-Variable.woff2
          weight: 700
