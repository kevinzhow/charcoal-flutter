name: charcoal_icons
description: Charcoal V2 SVG icons for Flutter.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - assets/v2/16/regular/
    - assets/v2/16/solid/
    - assets/v2/20/regular/
    - assets/v2/20/solid/
    - assets/v2/24/color/
    - assets/v2/24/regular/
    - assets/v2/24/solid/
