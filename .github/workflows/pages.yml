name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [next, main]
    paths:
      - 'example/**'
      - 'packages/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          cache: true
      - run: flutter pub get
      - name: Build Flutter Web
        run: flutter build web --release --wasm --base-href "/${{ github.event.repository.name }}/"
        working-directory: example
      - name: Add GitHub Pages fallback
        run: |
          cp example/build/web/index.html example/build/web/404.html
          touch example/build/web/.nojekyll
      - name: Upload build for review and visual capture
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: showcase-web
          path: example/build/web
          retention-days: 7
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: example/build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
